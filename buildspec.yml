version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "blacklist-api"
    IMAGE_TAG: "1.0"
    AWS_DEFAULT_REGION: "us-east-1"
    ACCOUNT_ID: "780522923809"
    RDS_DB_NAME: "blacklistdb"
    SECRET_KEY: "super-secret"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 780522923809.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...          
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} 780522923809.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo Writing Image Definitions file...
      - printf '[{"name":"blacklist-api","imageUri":"%s"}]' "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}" > imagedefinitions.json
      - printf '{"ImageURI":"%s"}' "${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG"  > imageDetail.json
      - cat imagedefinitions.json
artifacts:
  files:
    - '**/*'
    - imageDetail.json
    - Dockerfile
    - appspec.yaml
    - taskdef.json
    - imagedefinitions.json